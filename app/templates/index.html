
<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>
</head>
<body>
    <h1>Student Task Manager</h1>

    <form method="POST">
        <input type="text" name="task"
               placeholder="Enter your task" required>
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>

    <ul>
        {% for task in tasks %}
        <li>
            {{ task[1] }}
            <a href="/delete/{{ task[0] }}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
