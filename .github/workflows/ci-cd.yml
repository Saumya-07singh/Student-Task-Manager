name: Student Task Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Build Docker Image
        run: docker build -t student-task-manager:latest ./app